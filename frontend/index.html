<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BaggageFlow</title>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Baggage sorting simulator</p>
        <h1>BaggageFlow</h1>
      </header>
      <section aria-labelledby="map-title">
        <div class="toolbar">
          <h2 id="map-title">Route</h2>
          <button id="toggle" type="button" disabled>Start</button>
          <p id="time" aria-live="off">00:00.00 · tick 0</p>
          <p id="connection" data-state="disconnected">Connecting…</p>
        </div>
        <p id="status" role="status">Initializing graphics…</p>
        <div id="map"></div>
        <dl id="counters" aria-label="Engine counters"></dl>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
