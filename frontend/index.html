<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BaggageFlow</title>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Baggage sorting simulator</p>
        <h1>BaggageFlow</h1>
      </header>
      <section aria-labelledby="map-title">
        <div class="toolbar">
          <h2 id="map-title">Plant</h2>
          <button id="toggle" type="button" disabled>Start</button>
          <p id="time" aria-live="off">00:00.00 · tick 0</p>
          <p id="connection" data-state="disconnected">Connecting…</p>
        </div>
        <p id="status" role="status">Initializing graphics…</p>
        <div class="plant">
          <div id="map">
            <div class="map-tools" role="group" aria-label="View">
              <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
              <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
              <button id="fit" type="button" aria-label="Show the whole plant">Fit</button>
            </div>
          </div>
          <aside id="panel" aria-labelledby="panel-title" aria-live="polite">
            <h3 id="panel-title">Details</h3>
            <div id="panel-body"></div>
          </aside>
        </div>
        <p id="hint">Scroll to zoom, drag to move the view, click a bag or a belt for its details; Esc clears the selection.</p>
        <dl id="counters" aria-label="Engine counters"></dl>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
