<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BaggageFlow</title>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Baggage sorting simulator</p>
        <h1>BaggageFlow</h1>
      </header>
      <section aria-labelledby="map-title">
        <div class="toolbar">
          <h2 id="map-title">Plant</h2>
          <button id="toggle" type="button" disabled>Start</button>
          <button id="reset" type="button" class="secondary" disabled>Reset</button>
          <div class="speeds" role="group" aria-label="Simulation speed">
            <button type="button" data-speed="1" aria-pressed="true" disabled>1×</button>
            <button type="button" data-speed="2" aria-pressed="false" disabled>2×</button>
            <button type="button" data-speed="5" aria-pressed="false" disabled>5×</button>
          </div>
          <p id="time" aria-live="off">00:00.00 · tick 0</p>
          <p id="connection" data-state="disconnected">Connecting…</p>
        </div>
        <div class="plant">
          <div id="map">
            <p id="status" role="status">Initializing graphics…</p>
            <div class="map-tools" role="group" aria-label="View">
              <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
              <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
              <button id="fit" type="button" aria-label="Show the whole plant">Fit</button>
            </div>
          </div>
          <aside id="panel" aria-labelledby="panel-title">
            <h3 id="panel-title">Details</h3>
            <div id="panel-body"></div>
            <div id="panel-actions"></div>
          </aside>
        </div>
        <p id="hint">Scroll to zoom, drag to move the view, click a bag, a belt or a check-in desk for its details and commands; Esc clears the selection.</p>
        <div class="indicators" aria-labelledby="indicators-title">
          <div class="indicators-head">
            <h3 id="indicators-title">Indicators</h3>
            <p id="indicators-note"></p>
          </div>
          <div id="counters"></div>
        </div>
        <div class="alarms" aria-labelledby="alarms-title">
          <div class="events-head">
            <h3 id="alarms-title">Open alarms</h3>
            <p id="alarms-note"></p>
            <button id="acknowledge-all" type="button" class="secondary" disabled>Acknowledge all</button>
          </div>
          <ol id="alarm-list"></ol>
        </div>
        <div class="events" aria-labelledby="events-title">
          <div class="events-head">
            <h3 id="events-title">Event log</h3>
            <p id="events-note"></p>
            <div class="severity-filter" role="group" aria-label="Severities shown"></div>
          </div>
          <ol id="event-list" aria-live="off"></ol>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
